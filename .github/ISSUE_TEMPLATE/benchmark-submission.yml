name: Benchmark submission
description: Submit a model result for maintainer review on the PT-BR typed-decisions benchmark
title: "Benchmark submission: <model>"
labels: ["evaluation"]
body:
  - type: markdown
    attributes:
      value: |
        Follow the [evaluation guide](https://github.com/felhen-ai/saracura/blob/main/research/evaluation-guide.md). Submissions are reviewed before listing. V3 is the current protocol; V1/V2 results remain historical.
        Do not paste credentials, private prompts, private text or server addresses.
  - type: input
    id: model
    attributes:
      label: Public model id and Hub commit (or sha256 weights digest)
      description: A 40-hex commit or `sha256:<64 hex>`. `main` does not qualify.
      placeholder: org/model @ 0123456789abcdef0123456789abcdef01234567
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime
      description: Serving software and version, hardware, quantization, context settings, subfolder.
    validations:
      required: true
  - type: textarea
    id: task-training
    attributes:
      label: Training on these benchmark tasks or source datasets
      description: "State yes, no, or unknown, and link the model card or other source. Known task-tuned models are displayed separately; unknown does not certify unseen data. Private-track evaluation is not required."
      placeholder: "Unknown; the model card does not document task-level training data. Source: ..."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation output
      description: "V3: paste the output of benchmark_v3.py validate. V1/V2: paste validate_submission.py output, including warnings."
      render: text
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Report
      description: "V3: attach the combined JSON, both replacement task reports and the original validated report, or public links. Dataset identities and scores are read from those files. V1/V2: attach the original ptbr_bench.py report."
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The submitted checkpoint is publicly accessible.
          required: true
        - label: The submitted result is complete and includes no private text, credentials, private server addresses or local filesystem paths.
          required: true
