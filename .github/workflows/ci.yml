name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests benchmarks
      - run: uv run pytest -q
      - run: uv run python -m benchmarks.validate_manifests
      - run: uv run python benchmarks/validate_default_environment.py
      - run: uv run python -m benchmarks.encoder_gate validate-registry
      - run: uv run python -m benchmarks.first_party_gate validate-protocol
      - run: uv build
      - run: uv run python benchmarks/inspect_wheel.py dist/*.whl dist/*.tar.gz

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install pinned gitleaks CLI
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
      - run: ./gitleaks detect --source . --no-git --redact --exit-code 1

  unicode-vectors:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev
      - run: uv run pytest -q tests/test_first_party_packet.py

  local-minilm:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev --extra local-minilm
      # Linux has no MPS device. The live MPS tests are explicitly skipped;
      # this job exercises closed capsule/tensor/CPU validation without model
      # downloads, snapshot discovery, or operator artifacts.
      - run: uv run pytest -q tests/test_human_training.py tests/test_human_calibration.py tests/test_calibration.py tests/test_phase4a.py

  universal-local:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --dev --extra universal-local
      # Synthetic fixtures only: no model host, checkpoint, or operator cache.
      - run: uv run pytest -q tests/test_universal_local.py
      - run: uv run python -m benchmarks.universal_local validate-registry
      - run: uv run python -m benchmarks.validate_manifests

  phase4e-offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # Fake encoder and policy paths only: no MPS, model weights, provider,
      # snapshot, or optional ML dependency is present in this job.
      - run: uv sync --locked --dev
      - run: uv run pytest -q tests/test_phase4e.py
      - run: uv run python -m benchmarks.validate_manifests
      - run: uv run python benchmarks/validate_default_environment.py
