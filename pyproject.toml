[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "saracura"
version = "0.1.0a2"
description = "A local-first decision model project for fast typed decisions at scale."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Saracura contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.10,<3",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
local-minilm = [
  "cryptography>=45,<46",
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]
# Compatibility alias retained for the existing encoder research gate.
encoder-eval = [
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]
# Checkout-only Phase 4C.2 acquisition and later local adapter lane.  These
# dependencies are intentionally absent from the default environment.
universal-local = [
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.48,<5",
  "tokenizers>=0.21,<1",
]
# Opt-in Phase 5B orchestration only: describe/prepare/serve/evaluate of a
# pinned open candidate. Imports stay lazy; the default environment never
# gains these modules. No model/weight dependency is declared here because
# the Kev service runs out of process under its own locked Python 3.12.
phase5-candidate = [
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "huggingface_hub>=0.25,<1",
]
# Opt-in only: P2 imports this stack from explicit private-training commands.
# Default and lightweight test installations remain model- and dataset-free.
v02-training = [
  "bitsandbytes>=0.45,<1",
  "peft>=0.14,<1",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers==5.16.0",
]
ptbr-benchmark = [
  "pyarrow>=22,<26",
]

[project.scripts]
saracura = "saracura.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.uv]
conflicts = [
  [
    { extra = "encoder-eval" },
    { extra = "v02-training" },
  ],
  [
    { extra = "local-minilm" },
    { extra = "v02-training" },
  ],
  [
    { extra = "phase5-candidate" },
    { extra = "v02-training" },
  ],
  [
    { extra = "universal-local" },
    { extra = "v02-training" },
  ],
]

[tool.hatch.build.targets.wheel]
packages = ["src/saracura"]
include = ["src/saracura/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/benchmarks",
  "/.venv*",
  "/.artifacts",
  "/dist",
  "/.pytest_cache",
  "/**/__pycache__",
  "/**/*.pyc",
  "/benchmarks/.artifacts",
  "/**/*.jsonl",
  "/**/*.safetensors",
  "/**/base-states.jsonl",
  "/**/split-plan.json",
  "/**/contributors.json",
  "/**/annotations.jsonl",
  "/**/adjudications.jsonl",
  "/**/controls.json",
  "/**/takedown-ledger.jsonl",
  "/**/intake-manifest.json",
  "/**/train.jsonl",
  "/**/dev.jsonl",
  "/**/calibration.jsonl",
  "/**/blind-test.jsonl",
  "/**/packet-manifest.json",
  "/**/release-input-manifest.json",
  "/**/packet-release-request.json",
  "/**/packet-release-receipt.json",
  "/**/maintainer-release-receipt.json",
  "/**/capsule-descriptor.json",
  "/**/embedding-manifest.json",
  "/**/training-manifest.json",
  "/**/checkpoint.safetensors",
  "/**/embeddings.safetensors",
  "/**/temperature-fit.json",
  "/**/calibration-candidate.json",
  "/**/research-calibration.json",
  "/**/blind-report.json",
  "/**/training-report.json",
  "/**/01-precommitted.json",
  "/**/02-running.json",
  "/**/03-sealed.json",
  "/**/phase4e-plan.json",
  "/**/phase4e-accepted.jsonl",
  "/**/phase4e-cost-ledger.json",
  "/**/phase4e-training-manifest.json",
  "/**/phase4e-checkpoint.safetensors",
  "/**/phase4e-holdout-report.json",
  "/**/phase4e-embedding-manifest.json",
  "/**/phase4e-embedding-descriptor.json",
  "/**/phase4e-accepted-packet-receipt.json",
  "/**/phase4e-epoch-ledger.json",
  "/**/phase4e-dev-selection.json",
  "/**/phase4e-holdout-release.json",
  "/**/phase4e-training-capsule.json",
  "/**/phase4e-comparison-plan.json",
  "/**/phase4e-comparison-accepted.jsonl",
  "/**/phase4e-comparison-cost-ledger.json",
  "/**/phase4e-comparison-report.json",
  "/**/*-report.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Scripts da trilha de pesquisa carregam prompts e tabelas em strings longas.
"research/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["saracura"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
