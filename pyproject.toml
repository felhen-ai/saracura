[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "saracura"
version = "0.1.0a1"
description = "A research-only, local-first engine for typed decisions."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Saracura contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "pydantic>=2.10,<3",
  "rfc8785==0.1.4",
]

[project.optional-dependencies]
local-minilm = [
  "cryptography>=45,<46",
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]
# Compatibility alias retained for the existing encoder research gate.
encoder-eval = [
  "platformdirs>=4.3,<5",
  "psutil>=6.1,<7",
  "safetensors>=0.5,<1",
  "torch>=2.5,<3",
  "transformers>=4.47,<5",
]

[project.scripts]
saracura = "saracura.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/saracura"]
include = ["src/saracura/**"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv*",
  "/.artifacts",
  "/dist",
  "/.pytest_cache",
  "/**/__pycache__",
  "/**/*.pyc",
  "/benchmarks/.artifacts",
  "/**/*.jsonl",
  "/**/*.safetensors",
  "/**/base-states.jsonl",
  "/**/split-plan.json",
  "/**/contributors.json",
  "/**/annotations.jsonl",
  "/**/adjudications.jsonl",
  "/**/controls.json",
  "/**/takedown-ledger.jsonl",
  "/**/intake-manifest.json",
  "/**/train.jsonl",
  "/**/dev.jsonl",
  "/**/calibration.jsonl",
  "/**/blind-test.jsonl",
  "/**/packet-manifest.json",
  "/**/release-input-manifest.json",
  "/**/packet-release-request.json",
  "/**/packet-release-receipt.json",
  "/**/maintainer-release-receipt.json",
  "/**/capsule-descriptor.json",
  "/**/embedding-manifest.json",
  "/**/training-manifest.json",
  "/**/checkpoint.safetensors",
  "/**/embeddings.safetensors",
  "/**/temperature-fit.json",
  "/**/calibration-candidate.json",
  "/**/research-calibration.json",
  "/**/blind-report.json",
  "/**/training-report.json",
  "/**/01-precommitted.json",
  "/**/02-running.json",
  "/**/03-sealed.json",
  "/**/*-report.json",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["saracura"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
